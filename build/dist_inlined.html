  { key: 'cat',  label: 'CAT',  idle: 'catIdle',  walk: 'catWalk',  color: '#3a3a3a' },
  { key: 'fox',  label: 'FOX',  idle: 'foxIdle',  walk: 'foxWalk',  color: '#d27a3e' },

// ============================================================
// CANVAS + INPUT
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  const targetRatio = VW / VH;
  const screenRatio = w / h;
  let cw, ch;
  if (screenRatio > targetRatio) { ch = h; cw = h * targetRatio; }
  else { cw = w; ch = w / targetRatio; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = (cw / VW) * dpr;
  offX = 0; offY = 0;
}
window.addEventListener('resize', resize);
resize();

// pointer state
const input = { down: false, x: VW/2, y: VH/2, justDown: false, justUp: false };
function toLocal(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  const lx = (clientX - r.left) / r.width * VW;
  const ly = (clientY - r.top) / r.height * VH;
  return { x: lx, y: ly };
}
function ptrDown(e){
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  const p = toLocal(t.clientX, t.clientY);
  input.down = true; input.justDown = true; input.x = p.x; input.y = p.y;
  unlockAudio();
}
function ptrMove(e){
  if (!input.down) return;
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  const p = toLocal(t.clientX, t.clientY);
  input.x = p.x; input.y = p.y;
}
function ptrUp(e){
  e.preventDefault();
  input.down = false; input.justUp = true;
}
canvas.addEventListener('mousedown', ptrDown);
canvas.addEventListener('mousemove', ptrMove);
canvas.addEventListener('mouseup', ptrUp);
canvas.addEventListener('touchstart', ptrDown, { passive: false });
canvas.addEventListener('touchmove', ptrMove, { passive: false });
canvas.addEventListener('touchend', ptrUp, { passive: false });
canvas.addEventListener('touchcancel', ptrUp, { passive: false });

// ============================================================
// ASSET LOADER
// ============================================================
const images = {};
const audios = {};
let assetsLoaded = 0, assetsTotal = 0;

function loadImage(key, src){
  assetsTotal++;
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { images[key] = img; assetsLoaded++; res(); };
    img.onerror = () => { console.warn('img fail', key); assetsLoaded++; res(); };
    img.src = src;
  });
}
function loadAudio(key, src, loop){
  assetsTotal++;
  return new Promise(res => {
    const a = new Audio();
    a.preload = 'auto';
    a.src = src;
    a.loop = !!loop;
    if (loop) a.volume = 0.5; else a.volume = 0.85;
    const done = () => { audios[key] = a; assetsLoaded++; res(); };
    a.oncanplaythrough = done;
    a.onerror = () => { console.warn('audio fail', key); assetsLoaded++; res(); };
    // safety timeout — some browsers stall canplaythrough
    setTimeout(done, 2500);
  });
}

function loadAll(){
  const ps = [];
  ps.push(loadImage('bg',       ASSETS.bg));
  ps.push(loadImage('phantom',  ASSETS.phantom));
  for (const a of ANIMALS){
    ps.push(loadImage(a.idle, ASSETS[a.idle]));
    ps.push(loadImage(a.walk, ASSETS[a.walk]));
  }
  ps.push(loadAudio('music',    ASSETS.music, true));
  ps.push(loadAudio('go',       ASSETS.go));
  ps.push(loadAudio('readyset', ASSETS.readyset));
  ps.push(loadAudio('gem',      ASSETS.gem));
  ps.push(loadAudio('death',    ASSETS.death));
  ps.push(loadAudio('stinger',  ASSETS.stinger));
  ps.push(loadAudio('fall',     ASSETS.fall));
  return Promise.all(ps);
}

// ============================================================
// AUDIO
// ============================================================
let muted = false, audioUnlocked = false;
function unlockAudio(){
  if (audioUnlocked) return;
  audioUnlocked = true;
  // touch every audio briefly so iOS unlocks
  Object.values(audios).forEach(a => {
    try { a.play().then(()=>{ if (!a.loop) { a.pause(); a.currentTime = 0; } }).catch(()=>{}); } catch(e){}
  });
  if (audios.music && !muted){ try { audios.music.play(); } catch(e){} }
}
function playSfx(key){
  if (muted) return;
  const src = audios[key]; if (!src) return;
  try {
    // Clone for overlap
    const a = src.cloneNode();
    a.volume = src.volume;
    a.play().catch(()=>{});
  } catch(e){}
}
function setMuted(v){
  muted = v;
  document.getElementById('mute').textContent = v ? '🔇' : '🔊';
  if (audios.music){
    if (v) audios.music.pause();
    else if (audioUnlocked) audios.music.play().catch(()=>{});
  }
}
document.getElementById('mute').addEventListener('click', e => {
  e.stopPropagation();
  setMuted(!muted);
});

// ============================================================
// DRAW HELPERS
// ============================================================
function clear(color){
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function setTransform(){
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
}
function drawImg(img, x, y, w, h, flip){
  if (!img) return;
  if (flip){
    ctx.save();
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, w, h);
    ctx.restore();
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
}
function drawSprite(img, frame, frameW, frameH, x, y, dw, dh, flip){
  if (!img) return;
  const sx = frame * frameW;
  if (flip){
    ctx.save();
    ctx.translate(x + dw, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, sx, 0, frameW, frameH, 0, 0, dw, dh);
    ctx.restore();
  } else {
    ctx.drawImage(img, sx, 0, frameW, frameH, x, y, dw, dh);
  }
}
function drawText(text, x, y, size, color, opts){
  opts = opts || {};
  ctx.font = (opts.bold !== false ? '900 ' : '') + size + 'px ' + (opts.font || '"Arial Black", system-ui, sans-serif');
  ctx.textAlign = opts.align || 'center';
  ctx.textBaseline = opts.baseline || 'middle';
  if (opts.stroke){
    ctx.lineWidth = opts.strokeW || Math.max(4, size * 0.18);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = opts.stroke;
    ctx.strokeText(text, x, y);
  }
  if (opts.shadow){
    ctx.fillStyle = opts.shadow;
    ctx.fillText(text, x + (opts.sx||0), y + (opts.sy||6));
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
function drawHeart(x, y, size, filled){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size/30, size/30);
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(0, 4, -6, -2, -12, -2);
  ctx.bezierCurveTo(-20, -2, -20, 8, -20, 8);
  ctx.bezierCurveTo(-20, 16, -10, 22, 0, 30);
  ctx.bezierCurveTo(10, 22, 20, 16, 20, 8);
  ctx.bezierCurveTo(20, 8, 20, -2, 12, -2);
  ctx.bezierCurveTo(6, -2, 0, 4, 0, 8);
  ctx.closePath();
  if (filled){
    const g = ctx.createLinearGradient(0, -5, 0, 25);
    g.addColorStop(0, '#ff6b8a'); g.addColorStop(1, '#e02347');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();
}
function drawGem(x, y, r, t){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(t*4) * 0.15);
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.lineTo(r*0.85, -r*0.2);
  ctx.lineTo(r*0.6, r);
  ctx.lineTo(-r*0.6, r);
  ctx.lineTo(-r*0.85, -r*0.2);
  ctx.closePath();
  const g = ctx.createLinearGradient(0,-r,0,r);
  g.addColorStop(0,'#fff9b0'); g.addColorStop(0.5,'#ffd93d'); g.addColorStop(1,'#ff9d00');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  // sparkle
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.ellipse(-r*0.3, -r*0.4, r*0.18, r*0.4, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawPhantom(x, y, r, rot, scaleY){
  scaleY = scaleY || 1;
  if (images.phantom){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(1, scaleY);
    const s = r * 2.2;
    ctx.drawImage(images.phantom, -s/2, -s/2, s, s);
    ctx.restore();
  } else {
    // fallback
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
}
function drawPhantomShadow(x, t){
  // Ground indicator: pulsing red circle
  const r = 60 + Math.sin(t*10) * 6;
  ctx.save();
  ctx.translate(x, GROUND_Y + 60);
  ctx.scale(1, 0.35);
  ctx.fillStyle = 'rgba(255, 30, 60, ' + (0.3 + Math.sin(t*10)*0.2) + ')';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255, 100, 120, 0.9)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

// PARTICLES
// ============================================================
const particles = [];
function spawnBurst(x, y, n, color){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 150 + Math.random() * 250;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 100,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 1.0,
      size: 4 + Math.random() * 6,
      color
    });
  }
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 600 * dt;
  }
}
function drawParticles(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSkyAndBg(t){
  // Animated sky gradient: deep purple night with eruption glow
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  const flicker = 0.5 + Math.sin(t * 3) * 0.1 + Math.sin(t * 7.3) * 0.05;
  g.addColorStop(0, '#1a0a2e');
  g.addColorStop(0.45, '#3d1a4f');
  g.addColorStop(0.7, '#8a2a3a');
  g.addColorStop(1, '#c9442a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);

  // Eruption glow (volcano center)
  const cx = VW * 0.5, cy = VH * 0.42;
  const rg = ctx.createRadialGradient(cx, cy, 30, cx, cy, 400);
  rg.addColorStop(0, 'rgba(255, 180, 80, ' + (0.35 * flicker * 2) + ')');
  rg.addColorStop(1, 'rgba(255, 100, 40, 0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, VW, VH);

  // Foreground jungle bg (sky punched through above)
  if (images.bg){
    // Scale bg to cover bottom 60% of view
    const bgImg = images.bg;
    const bgW = VW;
    const bgH = VW * (bgImg.height / bgImg.width);
    const by = VH - bgH;
    ctx.drawImage(bgImg, 0, by, bgW, bgH);
  }
}

// ---- PLAY ----
const playState = {
  player: { x: VW/2, y: GROUND_Y, vx: 0, frame: 0, frameT: 0, dir: 1, invuln: 0, flashT: 0 },
  phantoms: [],   // {x, vy, r, rot, vr, warned, warnX, fallSfxPlayed}
  gems: [],
  warnings: [],   // {x, t, life}
  score: 0,
  hearts: MAX_HEARTS,
  timeLeft: GAME_DURATION,
  spawnTimer: 0,
  gemTimer: 1.5,
  shake: 0,
  difficulty: 1
};
function initPlay(){
  playState.player.x = VW/2;
  playState.player.vx = 0;
  playState.player.invuln = 0;
  playState.player.flashT = 0;
  playState.phantoms.length = 0;
  playState.gems.length = 0;
  playState.warnings.length = 0;
  playState.score = 0;
  playState.hearts = MAX_HEARTS;
  playState.timeLeft = GAME_DURATION;
  playState.spawnTimer = 0.4;
  playState.gemTimer = 1.5;
  playState.shake = 0;
  playState.difficulty = 1;
}

function updatePlay(dt){
  const P = playState.player;
  // Difficulty ramps: easier first 4s, then ramps to ~2x
  const elapsed = GAME_DURATION - playState.timeLeft;
  playState.difficulty = 1 + Math.min(1.2, elapsed * 0.06);

  // Input → move target
  let targetX = P.x;
  if (input.down){
    targetX = input.x;
  }
  const dx = targetX - P.x;
  const maxSpeed = 700;
  const moveAmt = Math.sign(dx) * Math.min(Math.abs(dx) * 8 * dt, maxSpeed * dt);
  P.x += moveAmt;
  P.x = Math.max(80, Math.min(VW - 80, P.x));
  if (Math.abs(moveAmt) > 1) P.dir = moveAmt > 0 ? 1 : -1;

  const moving = Math.abs(moveAmt) > 0.5;
  if (moving){
    P.frameT += dt;
    if (P.frameT > 0.07){ P.frameT = 0; P.frame = (P.frame + 1) % 8; }
  } else {
    P.frameT += dt;
    if (P.frameT > 0.12){ P.frameT = 0; P.frame = (P.frame + 1) % 6; }
  }
  P.walking = moving;

  if (P.invuln > 0) P.invuln -= dt;
  if (P.flashT > 0) P.flashT -= dt;

  // Spawn phantoms
  playState.spawnTimer -= dt;
  if (playState.spawnTimer <= 0){
    spawnPhantom();
    playState.spawnTimer = (0.95 - playState.difficulty * 0.25) + Math.random() * 0.35;
  }
  // Spawn gems
  playState.gemTimer -= dt;
  if (playState.gemTimer <= 0){
    spawnGem();
    playState.gemTimer = 1.4 + Math.random() * 1.4;
  }

  // Update phantoms
  for (let i = playState.phantoms.length - 1; i >= 0; i--){
    const ph = playState.phantoms[i];
    ph.y += ph.vy * dt;
    ph.rot += ph.vr * dt;
    // Warning indicator before impact
    if (!ph.warned && ph.y > VH * 0.15){
      playState.warnings.push({ x: ph.x, t: 0, life: 0.8 });
      ph.warned = true;
      if (!ph.fallSfxPlayed){ playSfx('fall'); ph.fallSfxPlayed = true; }
    }
    // Collision with player
    if (P.invuln <= 0){
      const dx2 = ph.x - P.x, dy2 = ph.y - (P.y - 60);
      const d2 = dx2*dx2 + dy2*dy2;
      const hitR = ph.r + 50;
      if (d2 < hitR * hitR){
        // HIT
        playState.phantoms.splice(i, 1);
        playState.hearts = Math.max(0, playState.hearts - 1);
        P.invuln = 1.2;
        P.flashT = 0.4;
        playState.shake = 12;
        spawnBurst(P.x, P.y - 60, 22, '#ff5b8a');
        playSfx('death');
        continue;
      }
    }
    // Hit ground
    if (ph.y > GROUND_Y + 30){
      playState.phantoms.splice(i, 1);
      spawnBurst(ph.x, GROUND_Y + 40, 14, '#7d2a8a');
      playState.shake = Math.max(playState.shake, 6);
      continue;
    }
  }
  // Update gems
  for (let i = playState.gems.length - 1; i >= 0; i--){
    const g = playState.gems[i];
    g.y += g.vy * dt;
    g.rot += dt * 4;
    const dx2 = g.x - P.x, dy2 = g.y - (P.y - 60);
    if (dx2*dx2 + dy2*dy2 < (GEM_RADIUS + 50) * (GEM_RADIUS + 50)){
      playState.gems.splice(i, 1);
      playState.score += 1;
      spawnBurst(g.x, g.y, 14, '#ffd93d');
      playSfx('gem');
      continue;
    }
    if (g.y > GROUND_Y + 30){ playState.gems.splice(i, 1); }
  }
  // Update warnings
  for (let i = playState.warnings.length - 1; i >= 0; i--){
    const w = playState.warnings[i];
    w.t += dt; w.life -= dt;
    if (w.life <= 0) playState.warnings.splice(i, 1);
  }

  // shake decay
  playState.shake *= Math.pow(0.001, dt);

  // timer
  playState.timeLeft -= dt;
  if (playState.timeLeft <= 0 || playState.hearts <= 0){
    if (playState.hearts <= 0) playSfx('stinger');
    setScene('end', initEnd);
  }
}

function spawnPhantom(){
  const x = 100 + Math.random() * (VW - 200);
  const r = 44 + Math.random() * 22;
  const vy = (320 + Math.random() * 180) * (0.85 + playState.difficulty * 0.25);
  playState.phantoms.push({
    x, y: -100,
    vy, r,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 5,
    warned: false,
    fallSfxPlayed: false
  });
}
function spawnGem(){
  const x = 120 + Math.random() * (VW - 240);
  playState.gems.push({ x, y: -60, vy: 230 + Math.random()*70, rot: 0 });
}

function drawGameWorld(t, paused){
  // background already drawn
  // Floor ground tint
  const gg = ctx.createLinearGradient(0, GROUND_Y, 0, VH);
  gg.addColorStop(0, 'rgba(40, 60, 25, 0)');
  gg.addColorStop(1, 'rgba(20, 30, 10, 0.65)');
  ctx.fillStyle = gg;
  ctx.fillRect(0, GROUND_Y, VW, VH - GROUND_Y);

  // warnings
  if (!paused){
    for (const w of playState.warnings){
      const fade = Math.max(0, w.life / 0.8);
      ctx.globalAlpha = fade;
      drawPhantomShadow(w.x, w.t);
      ctx.globalAlpha = 1;
    }
  }

  // gems
  for (const g of playState.gems){
    drawGem(g.x, g.y, GEM_RADIUS, t);
  }

  // player
  const P = playState.player;
  const a = chosenAnimal;
  const sheetKey = P.walking ? a.walk : a.idle;
  const img = images[sheetKey];
  if (img){
    const frames = P.walking ? 8 : 6;
    const fW = img.width / frames, fH = img.height;
    const dw = fW * (140/fH) * ANIMAL_SCALE;
    const dh = 140 * ANIMAL_SCALE;
    if (P.flashT > 0) ctx.globalAlpha = (Math.floor(P.flashT * 24) % 2 === 0) ? 0.35 : 1;
    drawSprite(img, P.frame % frames, fW, fH, P.x - dw/2, P.y - dh, dw, dh, P.dir < 0);
    ctx.globalAlpha = 1;
  }

  // phantoms
  for (const ph of playState.phantoms){
    drawPhantom(ph.x, ph.y, ph.r, ph.rot);
  }
}
function drawHUD(t){
  // Timer bar top
  const barW = VW - 80, barH = 18;
  const bx = 40, by = 40;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(bx, by, barW, barH);
  const frac = Math.max(0, playState.timeLeft / GAME_DURATION);
  const bg = ctx.createLinearGradient(0, 0, barW, 0);
  bg.addColorStop(0, '#76ff5b'); bg.addColorStop(0.6, '#ffd93d'); bg.addColorStop(1, '#ff5b3a');
  ctx.fillStyle = bg;
  ctx.fillRect(bx, by, barW * frac, barH);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.strokeRect(bx, by, barW, barH);
  // time text
  drawText(Math.ceil(playState.timeLeft) + 's', VW/2, by + barH + 30, 32, '#fff', { stroke:'#3a1850', strokeW:7 });

  // hearts top-left
  for (let i = 0; i < MAX_HEARTS; i++){
    drawHeart(70 + i * 60, 130, 36, i < playState.hearts);
  }
  // score top-right
  drawText('💎 ' + playState.score, VW - 60, 130, 44, '#ffd93d', { align:'right', stroke:'#3a1850', strokeW:8 });
}
function drawPlay(t){
  // camera shake offset
  let sx = 0, sy = 0;
  if (playState.shake > 0.3){
    sx = (Math.random() - 0.5) * playState.shake * 2;
    sy = (Math.random() - 0.5) * playState.shake * 2;
  }
  ctx.save();
  ctx.translate(sx, sy);
  drawSkyAndBg(t);
  drawGameWorld(t);
  ctx.restore();
  drawHUD(t);
}

const endState = { ctaPulse: 0, confetti: [] };
function initEnd(){
  // Stop music gradually
  if (audios.music){ try { audios.music.volume = 0.3; } catch(e){} }
  endState.confetti.length = 0;
  // Confetti rain
  for (let i = 0; i < 60; i++){
    endState.confetti.push({
      x: Math.random() * VW,
      y: -50 - Math.random() * 400,
      vy: 180 + Math.random() * 220,
      vx: (Math.random() - 0.5) * 80,
      size: 8 + Math.random() * 8,
      color: ['#ffd93d','#76ff5b','#ff5b8a','#5be0ff','#c45aff'][i % 5],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 6
    });
  }
}
function updateEnd(dt){
  endState.ctaPulse += dt;
  for (const c of endState.confetti){
    c.y += c.vy * dt; c.x += c.vx * dt; c.rot += c.vr * dt;
    if (c.y > VH + 30){ c.y = -30; c.x = Math.random() * VW; }
  }
  if (input.justDown){
    openStore();
  }
}
function drawEnd(t){
  drawSkyAndBg(t);
  // Big celebration animal in center walking in place
  const a = chosenAnimal;
  const img = images[a.walk];
  if (img){
    const frames = 8;
    const fW = img.width / frames, fH = img.height;
    const dh = 320, dw = fW * (dh/fH);
    const frame = Math.floor(t * 12) % frames;
    const px = VW/2 - dw/2;
    const py = VH * 0.42 - dh/2 + Math.sin(t * 4) * 10;
    drawSprite(img, frame, fW, fH, px, py, dw, dh, false);
  }

  // Title
  drawText('YOU SAVED', VW/2, VH * 0.18, 62, '#fff', { stroke:'#5b1e7a', strokeW:12 });
  drawText('JAMAA!', VW/2, VH * 0.18 + 80, 110, '#ffd93d', { stroke:'#5b1e7a', strokeW:18, shadow:'rgba(0,0,0,0.4)', sy:10 });

  drawText('💎 ' + playState.score + ' Gems Collected', VW/2, VH * 0.66, 40, '#fff', { stroke:'#3a1850', strokeW:9 });
  drawText('100+ MORE GAMES AWAIT!', VW/2, VH * 0.72, 36, '#5be0ff', { stroke:'#3a1850', strokeW:8 });

  // Confetti
  for (const c of endState.confetti){
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size/2, -c.size/3, c.size, c.size*0.6);
    ctx.restore();
  }

  // CTA button
  const pulse = 1 + Math.sin(endState.ctaPulse * 5) * 0.06;
  const btnW = 520, btnH = 130;
  const bx = VW/2, by = VH * 0.85;
  ctx.save();
  ctx.translate(bx, by);
  ctx.scale(pulse, pulse);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(-btnW/2 + 8, -btnH/2 + 10, btnW, btnH, 28);
  ctx.fill();
  // body gradient
  const bg = ctx.createLinearGradient(0, -btnH/2, 0, btnH/2);
  bg.addColorStop(0, '#76ff5b'); bg.addColorStop(1, '#1ea84a');
  ctx.fillStyle = bg;
  roundRect(-btnW/2, -btnH/2, btnW, btnH, 28);
  ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  roundRect(-btnW/2, -btnH/2, btnW, btnH, 28);
  ctx.stroke();
  drawText('PLAY FREE!', 0, -6, 64, '#fff', { stroke:'#1a5a25', strokeW:10 });
  ctx.restore();

  // small subtext
  drawText('Tap to download Animal Jam', VW/2, VH * 0.95, 26, '#fff', { stroke:'#3a1850', strokeW:6 });

  // store CTA hit area: whole screen tappable
  if (input.justDown){
    // handled in update
  }
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
// CTA / Store open (Mintegral MRAID + fallback)
// ============================================================
function openStore(){
  try {
    if (window.mraid && typeof window.mraid.open === 'function'){
      window.mraid.open(APP_STORE_URL);
      return;
    }
  } catch(e){}
  try {
    if (window.parent && window.parent.openAppStore){
      window.parent.openAppStore(APP_STORE_URL);
      return;
    }
  } catch(e){}
  try {
    if (window.gameEnd){ window.gameEnd(); }
  } catch(e){}
  try { window.open(APP_STORE_URL, '_blank'); } catch(e){}
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastT = performance.now();
let started = false;
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  sceneT += dt;

  // clear & draw based on scene
  setTransform();

  if (!started){
    drawLoading();
    if (assetsLoaded >= assetsTotal && assetsTotal > 0){
      started = true;
      // signal mraid ready
      try { if (window.mraid && window.mraid.getState && window.mraid.getState() === 'loading'){
        window.mraid.addEventListener('ready', ()=>{}); } } catch(e){}
      setScene('intro', initIntro);
    }
  } else if (scene === 'intro'){
    updateIntro(dt); drawIntro(sceneT);
  } else if (scene === 'picker'){
    updatePicker(dt); drawPicker(sceneT);
  } else if (scene === 'ready'){
    updateReady(dt); drawReady(sceneT);
  } else if (scene === 'play'){
    updatePlay(dt);
    drawPlay(sceneT);
    updateParticles(dt);
    drawParticles();
  } else if (scene === 'end'){
    updateEnd(dt); drawEnd(sceneT);
    updateParticles(dt); drawParticles();
  }

  // reset input edges
  input.justDown = false;
  input.justUp = false;

  requestAnimationFrame(frame);
}

// Kick off
loadAll();
requestAnimationFrame(frame);

// MRAID lifecycle
function mraidReady(){
  try { window.mraid.removeEventListener('ready', mraidReady); } catch(e){}
}
try {
  if (window.mraid){
    if (window.mraid.getState && window.mraid.getState() === 'loading'){
      window.mraid.addEventListener('ready', mraidReady);
    } else {
      mraidReady();
    }
  }
} catch(e){}

})();
</script>
