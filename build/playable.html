  #intro-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; z-index: 20; display: block; }
  #intro-video.hidden { display: none; }
  #skip-intro { position: fixed; top: 14px; right: 62px; padding: 6px 14px; border-radius: 18px; background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.6); color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; z-index: 30; cursor: pointer; user-select: none; }
  #skip-intro.hidden { display: none; }
  #sound-hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border-radius: 30px; background: rgba(0,0,0,0.65); border: 2px solid rgba(255,255,255,0.75); color: #fff; font-size: 16px; font-weight: 800; letter-spacing: 0.08em; z-index: 30; display: none; cursor: pointer; user-select: none; }
  #sound-hint.show { display: block; animation: soundPulse 1.4s ease-in-out infinite; }
  @keyframes soundPulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.08); } }
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <video id="intro-video" class="hidden" playsinline webkit-playsinline muted preload="auto" src="assets/intro.mp4"></video>
  <div id="skip-intro" class="hidden" aria-label="skip">SKIP &rsaquo;</div>
  <div id="sound-hint" aria-label="tap-for-sound">🔇 TAP FOR SOUND</div>
  <div id="mute" aria-label="mute">🔊</div>
<script>
(function(){
'use strict';

// ============================================================
// CONFIG
// ============================================================
const IOS_STORE_URL  = 'https://apps.apple.com/us/app/animal-jam/id1003820457';
const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.WildWorks.AnimalJamPlayWild&hl=en_IN';
const IS_ANDROID     = /android/i.test(navigator.userAgent);
const STORE_URL      = IS_ANDROID ? PLAY_STORE_URL : IOS_STORE_URL;
const GAME_DURATION = 22.0;       // seconds
let VW = 1280, VH = 720;           // virtual resolution — swapped per orientation
// GROUND_Y is where the animal's feet land. The bg grass strip ends at
// ~y=720 with the centered bg fit, and starts ~y=680, so 704 puts feet
// solidly on the visible grass. +4px compensates for the bottom pad inside
// each sprite cell (sprites are bottom-aligned with ~6/360 padding).
let GROUND_Y = VH - 16;
const ANIMAL_DISPLAY_H = 240;     // displayed height in px (sprites are 360px square)
const SPRITE_BOTTOM_PAD = 6/360;  // fraction of cell that's empty below feet
const PHANTOM_RADIUS = 52;
const GEM_RADIUS = 30;
const MAX_HEARTS = 3;

// Asset paths — replaced with data URIs by build step
const ASSETS = {
  bg:         'assets/Background.webp',
  bgPortrait: 'assets/Background_portrait.webp',
  phantom:    'assets/Phantom.webp',
  phantomFall:   'assets/PhantomFall.webp',
  phantomFlames: 'assets/PhantomFlames.webp',
  sapphire:      'assets/Sapphire.png',
  catIdle:   'assets/CatIdle.webp',
  catWalk:   'assets/CatWalk.webp',
  foxIdle:   'assets/FoxIdle.webp',
  foxWalk:   'assets/FoxWalk.webp',
  wolfIdle:  'assets/WolfIdle.webp',
  wolfWalk:  'assets/WolfWalk.webp',
  mgTemple:  'assets/MG_temple.webp',
  mgRoll:    'assets/MG_roll.webp',
  mgPest:    'assets/MG_pest.webp',
  mgDressed: 'assets/MG_dressed.webp',
  mgPuppy:   'assets/MG_puppy.webp',
  mgFoodies: 'assets/MG_foodies.webp',
  ajCard:    'assets/animal-jam-highres.webp',
  music:     'assets/music.mp3',
  go:        'assets/go.mp3',
  readyset:  'assets/readyset.mp3',
  gem:       'assets/gem.mp3',
  death:     'assets/death.mp3',
  stinger:   'assets/stinger.mp3',
  fall:      'assets/fall.mp3'
};

const ANIMALS = [
  { key: 'cat',  label: 'CAT',  idle: 'catIdle',  walk: 'catWalk',  color: '#3a3a3a', idleFrames: 10, walkFrames: 8,  idleScale: 1.0, sizeScale: 1.36, idleFrameTime: 0.10, idleBottomPad: 0.092, walkBottomPad: 0.168 },
  { key: 'fox',  label: 'FOX',  idle: 'foxIdle',  walk: 'foxWalk',  color: '#d27a3e', idleFrames: 14, walkFrames: 8,  idleScale: 1.0, sizeScale: 1.26, idleFrameTime: 0.19, idleBottomPad: 0.141, walkBottomPad: 0.045 },
  { key: 'wolf', label: 'WOLF', idle: 'wolfIdle', walk: 'wolfWalk', color: '#c45a9b', idleFrames: 6,  walkFrames: 8,  idleScale: 1.0, sizeScale: 1.00, idleFrameTime: 0.12, idleBottomPad: 0.021, walkBottomPad: 0.030 }
];

// ============================================================
// CANVAS + INPUT
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let scale = 1, offX = 0, offY = 0;
let isPortrait = false;

function resize(){
  const pw = window.innerWidth, ph = window.innerHeight;
  isPortrait = pw < ph;

  const stage = document.getElementById('stage');
  stage.style.transform = 'none';
  stage.style.transformOrigin = '';

  let cw, ch;
  if (isPortrait){
    // Portrait: fill the exact screen — no letterboxing. Derive VH from real aspect ratio.
    VW = 720;
    VH = Math.round(VW * ph / pw);
    cw = pw; ch = ph;
  } else {
    // Landscape: fixed 16:9 virtual canvas, letterbox if needed.
    VW = 1280; VH = 720;
    const targetRatio = VW / VH;
    const screenRatio = pw / ph;
    if (screenRatio > targetRatio){ ch = ph; cw = ph * targetRatio; }
    else { cw = pw; ch = pw / targetRatio; }
  }
  // Portrait: grass strip spans ~79-91% of image height — land feet at 91%
  // Landscape: grass strip is the bottom 5% — original VH-16 is correct
  GROUND_Y = isPortrait ? Math.round(VH * 0.91) : (VH - 16);

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  scale = (cw / VW) * dpr;
  offX = 0; offY = 0;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
resize();

// pointer state
const input = { down: false, x: VW/2, y: VH/2, justDown: false, justUp: false };
function toLocal(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  const lx = (clientX - r.left) / r.width  * VW;
  const ly = (clientY - r.top)  / r.height * VH;
  return { x: lx, y: ly };
}
function ptrDown(e){
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  const p = toLocal(t.clientX, t.clientY);
  input.down = true; input.justDown = true; input.x = p.x; input.y = p.y;
  unlockAudio();
}
function ptrMove(e){
  if (!input.down) return;
  e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  const p = toLocal(t.clientX, t.clientY);
  input.x = p.x; input.y = p.y;
}
function ptrUp(e){
  e.preventDefault();
  input.down = false; input.justUp = true;
}
canvas.addEventListener('mousedown', ptrDown);
canvas.addEventListener('mousemove', ptrMove);
canvas.addEventListener('mouseup', ptrUp);
canvas.addEventListener('touchstart', ptrDown, { passive: false });
canvas.addEventListener('touchmove', ptrMove, { passive: false });
canvas.addEventListener('touchend', ptrUp, { passive: false });
canvas.addEventListener('touchcancel', ptrUp, { passive: false });

// ============================================================
// ASSET LOADER
// ============================================================
const images = {};
const audios = {};        // key -> primary Audio element (music + pool[0])
const sfxPools = {};      // key -> array of pre-unlocked Audio elements for overlap
let assetsLoaded = 0, assetsTotal = 0;

function loadImage(key, src){
  assetsTotal++;
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { images[key] = img; assetsLoaded++; res(); };
    img.onerror = () => { console.warn('img fail', key); assetsLoaded++; res(); };
    img.src = src;
  });
}
function loadAudio(key, src, loop){
  assetsTotal++;
  return new Promise(res => {
    const a = new Audio();
    a.preload = 'auto';
    a.src = src;
    a.loop = !!loop;
    a.volume = loop ? 0.4 : 0.85;                     // music sits under the SFX
    const done = () => { audios[key] = a; assetsLoaded++; res(); };
    a.oncanplaythrough = done;
    a.onerror = () => { console.warn('audio fail', key); assetsLoaded++; res(); };
    // safety timeout — some browsers stall canplaythrough
    setTimeout(done, 2500);
    if (!loop){
      // Pre-create a small pool so each element can be unlocked inside the first
      // user gesture. (cloneNode-at-play elements are NOT unlocked on iOS → silent.)
      const pool = [a];
      for (let i = 1; i < 6; i++){
        const c = new Audio();
        c.preload = 'auto';
        c.src = src;
        c.volume = a.volume;
        pool.push(c);
      }
      sfxPools[key] = pool;
    }
  });
}

function loadAll(){
  const ps = [];
  ps.push(loadImage('bg',            ASSETS.bg));
  ps.push(loadImage('phantom',       ASSETS.phantom));
  ps.push(loadImage('phantomFall',   ASSETS.phantomFall));
  ps.push(loadImage('phantomFlames', ASSETS.phantomFlames));
  ps.push(loadImage('sapphire',      ASSETS.sapphire));
  for (const a of ANIMALS){
    ps.push(loadImage(a.idle, ASSETS[a.idle]));
    ps.push(loadImage(a.walk, ASSETS[a.walk]));
  }
  for (const k of ['mgTemple','mgRoll','mgPest','mgDressed','mgPuppy','mgFoodies']){
    ps.push(loadImage(k, ASSETS[k]));
  }
  ps.push(loadImage('ajCard',      ASSETS.ajCard));
  ps.push(loadImage('bgPortrait',  ASSETS.bgPortrait));
  ps.push(loadAudio('music',    ASSETS.music, true));
  ps.push(loadAudio('go',       ASSETS.go));
  ps.push(loadAudio('readyset', ASSETS.readyset));
  ps.push(loadAudio('gem',      ASSETS.gem));
  ps.push(loadAudio('death',    ASSETS.death));
  ps.push(loadAudio('stinger',  ASSETS.stinger));
  ps.push(loadAudio('fall',     ASSETS.fall));
  return Promise.all(ps);
}

// ============================================================
// AUDIO
// ============================================================
let muted = false, audioUnlocked = false;
// Unlock every pooled SFX element by play→pause (muted) within a user gesture,
// so later playSfx() calls are allowed to sound on iOS/Android. Runs once.
function primeSfxPools(){
  // Synchronous unlock: calling play() inside the gesture unlocks the element on
  // iOS; pausing immediately afterwards keeps it unlocked with no pending async
  // handler to race the first real playSfx().
  Object.keys(sfxPools).forEach(k => sfxPools[k].forEach(a => {
    try {
      a.muted = true;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});   // swallow AbortError from the immediate pause
      a.pause();
      a.currentTime = 0;
      a.muted = false;
    } catch(e){}
  }));
}
function unlockAudio(){
  // Don't start the music over the intro video (landscape only); pools are primed
  // on the first canvas tap, which only happens after the video is gone.
  if (scene === 'videoIntro') return;
  if (!audioUnlocked){
    audioUnlocked = true;
    primeSfxPools();
  }
  // Start (or resume) the looping music whenever it should be playing.
  if (audios.music && !muted && audios.music.paused){ audios.music.play().catch(()=>{}); }
}
function playSfx(key){
  if (muted) return;
  const pool = sfxPools[key]; if (!pool) return;
  // Reuse a free (paused/ended) element; fall back to the first if all are busy.
  let a = null;
  for (const el of pool){ if (el.paused || el.ended){ a = el; break; } }
  if (!a) a = pool[0];
  try { a.muted = false; a.currentTime = 0; a.play().catch(()=>{}); } catch(e){}
}
function setMuted(v){
  muted = v;
  document.getElementById('mute').textContent = v ? '🔇' : '🔊';
  if (audios.music){
    if (v) audios.music.pause();
    else if (audioUnlocked) audios.music.play().catch(()=>{});
  }
}
document.getElementById('mute').addEventListener('click', e => {
  e.stopPropagation();
  setMuted(!muted);
});

// ============================================================
// DRAW HELPERS
// ============================================================
function clear(color){
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function setTransform(){
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
}
function drawImg(img, x, y, w, h, flip){
  if (!img) return;
  if (flip){
    ctx.save();
    ctx.translate(x + w, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0, w, h);
    ctx.restore();
  } else {
    ctx.drawImage(img, x, y, w, h);
  }
}
function drawSprite(img, frame, frameW, frameH, x, y, dw, dh, flip){
  if (!img) return;
  const sx = frame * frameW;
  if (flip){
    ctx.save();
    ctx.translate(x + dw, y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, sx, 0, frameW, frameH, 0, 0, dw, dh);
    ctx.restore();
  } else {
    ctx.drawImage(img, sx, 0, frameW, frameH, x, y, dw, dh);
  }
}
function drawText(text, x, y, size, color, opts){
  opts = opts || {};
  // Pick font family based on size: AJTiki for big hero text, AJDelivery for UI.
  // Callers can override via opts.font.
  let family = opts.font;
  if (!family){
    family = (size >= 60)
      ? "'AJTiki', 'AJDelivery', 'Arial Black', system-ui, sans-serif"
      : "'AJDelivery', 'Arial Black', system-ui, sans-serif";
  }
  // AJTiki/AJDelivery are already display weight; only force 900 for fallback fonts.
  const wantBold = opts.bold !== false;
  const prefix = (wantBold && !/AJTiki|AJDelivery/.test(family)) ? '900 ' : '';
  ctx.font = prefix + size + 'px ' + family;
  ctx.textAlign = opts.align || 'center';
  ctx.textBaseline = opts.baseline || 'middle';
  if (opts.stroke){
    ctx.lineWidth = opts.strokeW || Math.max(4, size * 0.18);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = opts.stroke;
    ctx.strokeText(text, x, y);
  }
  if (opts.shadow){
    ctx.fillStyle = opts.shadow;
    ctx.fillText(text, x + (opts.sx||0), y + (opts.sy||6));
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
function drawHeart(x, y, size, filled){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size/30, size/30);
  // Heart path spans y=-2..30 (geometric center at y=14). Shift so the
  // visual center sits on the caller's (x, y).
  ctx.translate(0, -14);
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(0, 4, -6, -2, -12, -2);
  ctx.bezierCurveTo(-20, -2, -20, 8, -20, 8);
  ctx.bezierCurveTo(-20, 16, -10, 22, 0, 30);
  ctx.bezierCurveTo(10, 22, 20, 16, 20, 8);
  ctx.bezierCurveTo(20, 8, 20, -2, 12, -2);
  ctx.bezierCurveTo(6, -2, 0, 4, 0, 8);
  ctx.closePath();
  if (filled){
    const g = ctx.createLinearGradient(0, -5, 0, 25);
    g.addColorStop(0, '#ff6b8a'); g.addColorStop(1, '#e02347');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();
}
function drawGem(x, y, r, t){
  const img = images.sapphire;
  ctx.save();
  ctx.translate(x, y);

  const bob      = Math.sin(t * 3.0) * r * 0.09;
  const tilt     = Math.sin(t * 2.5) * 0.07;      // gentle oscillating tilt
  const pulse    = 1 + Math.sin(t * 4.5) * 0.04;  // subtle scale breathe

  // Blue radial glow — positively signals a collectible and creates instant
  // visual contrast with the orange/yellow phantom glow (danger vs reward).
  const glowA  = 0.65 + Math.sin(t * 5) * 0.35;
  const haloR  = r * 2.5;
  const rg = ctx.createRadialGradient(0, bob, r * 0.25, 0, bob, haloR);
  rg.addColorStop(0,   'rgba(100, 180, 255, ' + (0.50 * glowA) + ')');
  rg.addColorStop(0.5, 'rgba(50,  120, 220, ' + (0.20 * glowA) + ')');
  rg.addColorStop(1,   'rgba(30,   80, 200, 0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(0, bob, haloR, 0, Math.PI*2); ctx.fill();

  // Soft drop shadow grounds the gem in the scene
  ctx.save();
  ctx.translate(0, r * 1.15 + bob * 0.4);
  ctx.scale(1, 0.28);
  const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 1.1);
  sg.addColorStop(0, 'rgba(0,0,0,0.35)');
  sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.1, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  if (img){
    const dw = r * 2.2 * pulse;
    const dh = dw * (img.height / img.width);
    ctx.rotate(tilt);
    ctx.drawImage(img, -dw / 2, -dh / 2 + bob, dw, dh);
  } else {
    // Fallback: blue gem if sprite hasn't loaded yet
    ctx.beginPath();
    ctx.arc(0, bob, r, 0, Math.PI*2);
    ctx.fillStyle = '#5b9eff'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.restore();
}
// Phantom sheet layout — must match build_phantom_sprites.py
const PHANTOM_FALL_FRAME_W = 115;
const PHANTOM_FALL_FRAME_H = 95;
const PHANTOM_FALL_FRAMES  = 6;
const PHANTOM_FALL_VARIANTS = 3;
const PHANTOM_FLAME_FRAME_W = 60;
const PHANTOM_FLAME_FRAME_H = 112;
const PHANTOM_FLAME_FRAMES  = 7;

function drawPhantom(x, y, r, variant, animT, glowT, motionAngle){
  variant = variant | 0;
  animT = animT || 0;
  glowT = glowT == null ? 0 : glowT;
  motionAngle = motionAngle || 0;  // 0 = falling straight down

  // Glow halo behind phantom
  const pulse = 0.85 + Math.sin(glowT * 6) * 0.15;
  const haloR = r * 2.4 * pulse;
  const rg = ctx.createRadialGradient(x, y, r * 0.4, x, y, haloR);
  rg.addColorStop(0,   'rgba(255, 220, 110, 0.65)');
  rg.addColorStop(0.4, 'rgba(255, 165, 50, 0.35)');
  rg.addColorStop(0.8, 'rgba(220, 90, 30, 0.10)');
  rg.addColorStop(1,   'rgba(220, 90, 30, 0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(x, y, haloR, 0, Math.PI*2); ctx.fill();

  // Body display size — keep aspect ratio of source frame (115x95).
  const dw = r * 2.4;
  const dh = dw * (PHANTOM_FALL_FRAME_H / PHANTOM_FALL_FRAME_W);

  // Rocket flame wraps around the back of the phantom — drawn before the
  // body so tentacles appear silhouetted in front of the fire. Flame is
  // pivoted at the phantom's back and tilted opposite the motion vector,
  // so a phantom drifting down-right has its flame trailing up-left.
  const flameImg = images.phantomFlames;
  if (flameImg){
    const fFrame = Math.floor(animT * 14) % PHANTOM_FLAME_FRAMES;
    const flameW = dw * 0.95;
    const flameH = flameW * (PHANTOM_FLAME_FRAME_H / PHANTOM_FLAME_FRAME_W);
    ctx.save();
    ctx.translate(x, y + dh * 0.08);   // pivot at back of phantom
    ctx.rotate(-motionAngle);          // tilt against direction of travel
    ctx.drawImage(
      flameImg,
      fFrame * PHANTOM_FLAME_FRAME_W, 0,
      PHANTOM_FLAME_FRAME_W, PHANTOM_FLAME_FRAME_H,
      -flameW / 2, -flameH, flameW, flameH
    );
    ctx.restore();
  }

  // Phantom body — no rotation. Cycle through the variant's 6 frames.
  const fallImg = images.phantomFall;
  if (fallImg){
    const bFrame = Math.floor(animT * 9) % PHANTOM_FALL_FRAMES;
    const v = ((variant % PHANTOM_FALL_VARIANTS) + PHANTOM_FALL_VARIANTS)
              % PHANTOM_FALL_VARIANTS;
    ctx.drawImage(
      fallImg,
      bFrame * PHANTOM_FALL_FRAME_W, v * PHANTOM_FALL_FRAME_H,
      PHANTOM_FALL_FRAME_W, PHANTOM_FALL_FRAME_H,
      x - dw / 2, y - dh / 2, dw, dh
    );
  } else if (images.phantom){
    const s = r * 2.2;
    ctx.drawImage(images.phantom, x - s/2, y - s/2, s, s);
  } else {
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
}
function drawPhantomShadow(x, t){
  // Ground impact warning: warm orange pulsing ring matching the phantom glow
  const r = 65 + Math.sin(t*10) * 8;
  ctx.save();
  ctx.translate(x, GROUND_Y + 4);
  ctx.scale(1, 0.36);
  const fillA = 0.32 + Math.sin(t*10)*0.18;
  const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  rg.addColorStop(0, 'rgba(255, 200, 80, ' + fillA + ')');
  rg.addColorStop(1, 'rgba(255, 90, 30, 0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255, 180, 70, 0.95)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255, 240, 200, 0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

// Ambient drifting embers across whole scene
const embers = [];
function ensureEmbers(){
  if (embers.length) return;
  for (let i = 0; i < 30; i++){
    embers.push({
      x: Math.random() * VW,
      y: Math.random() * VH,
      vy: -8 - Math.random() * 18,
      vx: (Math.random() - 0.5) * 12,
      r: 1.2 + Math.random() * 2.2,
      tw: Math.random() * Math.PI * 2,
      twS: 2 + Math.random() * 3,
      baseA: 0.25 + Math.random() * 0.5
    });
  }
}
let emberLastT = 0;
function drawEmbers(t){
  ensureEmbers();
  const dt = Math.min(0.05, t - emberLastT); emberLastT = t;
  for (const e of embers){
    e.y += e.vy * dt;
    e.x += e.vx * dt;
    e.tw += e.twS * dt;
    if (e.y < -10){ e.y = VH + 10; e.x = Math.random() * VW; }
    if (e.x < -10) e.x = VW + 10;
    if (e.x > VW + 10) e.x = -10;
    const a = e.baseA * (0.55 + Math.sin(e.tw) * 0.45);
    ctx.fillStyle = 'rgba(255, 185, 80, ' + a + ')';
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
    ctx.fill();
  }
}


// ============================================================
// PARTICLES
// ============================================================
const particles = [];
function spawnBurst(x, y, n, color){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 150 + Math.random() * 250;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 100,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 1.0,
      size: 4 + Math.random() * 6,
      color
    });
  }
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 600 * dt;
  }
}
function drawParticles(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// BACKGROUND
// ============================================================
function drawSkyAndBg(t){
  const bgImg = isPortrait ? (images.bgPortrait || images.bg) : images.bg;
  let bgW, bgH, bx = 0, by = 0;
  if (bgImg){
    if (isPortrait){
      // Portrait bg is native portrait — scale to cover full canvas, bottom-anchor ground
      bgW = VW;
      bgH = VW * (bgImg.height / bgImg.width);
      bx  = 0;
      by  = VH - bgH;
      // If the portrait bg is shorter than the canvas, scale by height instead
      if (bgH < VH){ bgH = VH; bgW = VH * (bgImg.width / bgImg.height); bx = (VW - bgW) / 2; by = 0; }
    } else {
      // Cover-fit by width: bottom-anchor so grass aligns with GROUND_Y
      bgW = VW;
      bgH = VW * (bgImg.height / bgImg.width);
      bx  = 0;
      by  = VH - bgH;
    }
  } else {
    bgW = VW; bgH = VW * (550/900); bx = 0; by = VH - bgH;
  }

  // 1) Fill viewport bg with deep orange (in case crop reveals edges)
  ctx.fillStyle = '#3a0d12';
  ctx.fillRect(0, 0, VW, VH);

  // 2) Background image — actual game scene, scaled to cover width
  if (bgImg){
    ctx.drawImage(bgImg, bx, by, bgW, bgH);
  }

  // 3) Subtle volcano flicker glow over the bg's volcano peak (located mid-upper in bg)
  const vcx = bx + bgW * 0.46, vcy = by + bgH * 0.18;
  const flicker = 0.55 + Math.sin(t * 4.7) * 0.18 + Math.sin(t * 10.3) * 0.08;
  const rg = ctx.createRadialGradient(vcx, vcy, 15, vcx, vcy, 220);
  rg.addColorStop(0,   'rgba(255, 200, 110, ' + (0.4 * flicker) + ')');
  rg.addColorStop(0.6, 'rgba(255, 130, 50,  ' + (0.18 * flicker) + ')');
  rg.addColorStop(1,   'rgba(255, 130, 50, 0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, VW, VH);

  // 4) Ambient drifting embers
  drawEmbers(t);
}

const videoState = { el: null, skipEl: null, hintEl: null, ended: false };
function showSoundHint(on){ if (!videoState.hintEl) return; videoState.hintEl.classList.toggle('show', !!on); }
function unmuteVideo(){
  if (!videoState.el) return;
  try { videoState.el.muted = false; videoState.el.volume = 1.0;
    if (videoState.el.paused) videoState.el.play().catch(()=>{}); } catch(e){}
  showSoundHint(false);
}
function endVideoIntro(fromGesture){
  const videoT = (videoState.el && isFinite(videoState.el.currentTime)) ? videoState.el.currentTime : 0;
  if (videoState.el){ try { videoState.el.pause(); } catch(e){} videoState.el.classList.add('hidden'); }
  if (videoState.skipEl) videoState.skipEl.classList.add('hidden');
  if (videoState.hintEl) videoState.hintEl.classList.remove('show');
  if (audios.music){
    const dur = isFinite(audios.music.duration) ? audios.music.duration : 15;
    try { audios.music.currentTime = Math.min(videoT, Math.max(0, dur - 0.05)); } catch(e){}
  }
  setScene('intro', initIntro);
  // Skip is a user gesture → safe to prime SFX + start music now. On natural end
  // (no gesture) we leave priming to the first canvas tap, but still try the music.
  if (fromGesture) unlockAudio();
  else if (audios.music && !muted) audios.music.play().catch(()=>{});
}
function initVideoIntro(){
  videoState.el     = document.getElementById('intro-video');
  videoState.skipEl = document.getElementById('skip-intro');
  videoState.hintEl = document.getElementById('sound-hint');
  videoState.ended  = false;
  if (videoState.el){
    videoState.el.classList.remove('hidden');
    videoState.el.currentTime = 0;
    videoState.el.onended = () => { videoState.ended = true; endVideoIntro(false); };
    videoState.el.muted = false; videoState.el.volume = 1.0;
    const p = videoState.el.play();
    if (p && p.catch){ p.catch(() => {
      videoState.el.muted = true;
      videoState.el.play().then(() => { showSoundHint(true); }).catch(()=>{});
    }); }
  }
  if (videoState.skipEl){ videoState.skipEl.classList.add('hidden');
    videoState.skipEl.onclick = (e) => { e.stopPropagation(); endVideoIntro(true); }; }
  if (videoState.hintEl){ videoState.hintEl.classList.remove('show');
    videoState.hintEl.onclick = (e) => { e.stopPropagation(); unmuteVideo(); }; }
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
}
function updateVideoIntro(dt){
  if (videoState.skipEl && sceneT > 1.2) videoState.skipEl.classList.remove('hidden');
  if (input.justDown && videoState.el){
    if (videoState.el.muted) unmuteVideo();
    if (videoState.el.paused){ try { videoState.el.play(); } catch(e){} }
  }
  if (sceneT > 11.5) endVideoIntro(false);
}

// ---- PICKER ----
const pickerState = { hover: -1, autoT: 0 };
function initPicker(){
  pickerState.hover = -1; pickerState.autoT = 0;
}
function pickerCardRect(i){
  const cardW = isPortrait ? 210 : 220;
  const cardH = isPortrait ? 360 : 280;
  const gap   = isPortrait ? 15  : 36;
  const totalW = cardW * 3 + gap * 2;
  const x = (VW - totalW)/2 + i * (cardW + gap);
  const y = isPortrait ? VH * 0.32 : VH * 0.28;
  return { x, y, w: cardW, h: cardH };
}
function updatePicker(dt){
  pickerState.autoT += dt;
  if (input.justDown){
    for (let i = 0; i < 3; i++){
      const r = pickerCardRect(i);
      if (input.x >= r.x && input.x <= r.x + r.w && input.y >= r.y && input.y <= r.y + r.h){
        chosenAnimal = ANIMALS[i];
        playSfx('readyset');
        setScene('ready', initReady);
        return;
      }
    }
    // tap outside cards still doesn't progress — make sure hover wiggles
  }
}
function drawPicker(t){
  drawSkyAndBg(t);
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fillRect(0, 0, VW, VH);

  // Title + subtitle — anchored just above the cards so the group stays cohesive
  if (isPortrait){
    const cardTop = pickerCardRect(0).y;
    drawText('PICK YOUR CHAMPION!', VW/2, cardTop - 150, 72, '#ffc733', { stroke:'#3a1208', strokeW:14, shadow:'rgba(0,0,0,0.55)', sy:8 });
    drawText('Choose your hero to survive the phantoms!', VW/2, cardTop - 86, 27, '#ffe8c0', { stroke:'#3a1208', strokeW:6, shadow:'rgba(0,0,0,0.45)', sy:3 });
  } else {
    drawText('PICK YOUR CHAMPION!', VW/2, VH * 0.11, 72, '#ffc733', { stroke:'#3a1208', strokeW:14, shadow:'rgba(0,0,0,0.55)', sy:8 });
  }

  for (let i = 0; i < 3; i++){
    const a = ANIMALS[i];
    const r = pickerCardRect(i);
    const wig = Math.sin(t * 3 + i * 1.5) * 6;

    ctx.save();
    ctx.translate(r.x, r.y + wig);

    // Drop shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(8, 14, r.w, r.h, 22);
    ctx.fill();

    // Outer gold ornate frame
    const gg = ctx.createLinearGradient(0, 0, 0, r.h);
    gg.addColorStop(0, '#ffd86b'); gg.addColorStop(0.5, '#d49830'); gg.addColorStop(1, '#8e5d18');
    ctx.fillStyle = gg;
    roundRect(0, 0, r.w, r.h, 22);
    ctx.fill();

    // Inner panel — warm parchment
    const pad = 10;
    const pg = ctx.createLinearGradient(0, pad, 0, r.h - pad);
    pg.addColorStop(0, '#fff5d8'); pg.addColorStop(1, '#ffcf7a');
    ctx.fillStyle = pg;
    roundRect(pad, pad, r.w - pad*2, r.h - pad*2, 14);
    ctx.fill();

    // Animal idle — scale sprite to fill the taller portrait card
    const img = images[a.idle];
    if (img){
      const nf  = a.idleFrames || 6;
      const fps = 1 / (a.idleFrameTime || 0.12);
      const fW  = img.width / nf, fH = img.height;
      const frame = Math.floor(t * fps + i) % nf;
      const baseH = isPortrait ? 215 : 200;
      const dh = baseH * (a.sizeScale || 1), dw = fW * (dh/fH);
      const pickerFeetY = isPortrait ? r.h - 72 : 212;
      const pickerPad   = a.idleBottomPad || SPRITE_BOTTOM_PAD;
      const spriteY     = pickerFeetY - dh + dh * pickerPad;
      drawSprite(img, frame, fW, fH, (r.w - dw)/2, spriteY, dw, dh, false);
    }

    // Label band (dark brown plate at bottom)
    const bandH = 56;
    ctx.fillStyle = '#3a1f10';
    roundRect(pad + 6, r.h - bandH - 6, r.w - pad*2 - 12, bandH, 10);
    ctx.fill();
    ctx.strokeStyle = '#ffd86b'; ctx.lineWidth = 3;
    roundRect(pad + 6, r.h - bandH - 6, r.w - pad*2 - 12, bandH, 10);
    ctx.stroke();
    drawText(a.label, r.w/2, r.h - bandH/2 - 4, 36, '#ffd86b', { stroke:'#1a0d04', strokeW:5 });

    ctx.restore();
  }

  // TAP TO CHOOSE — clear, prominent prompt below the cards
  const r0 = pickerCardRect(0);
  if (isPortrait){
    const tapY = r0.y + r0.h + 104;         // comfortable gap clear of the cards
    const bounce = 1 + Math.sin(t * 4) * 0.05;
    ctx.save();
    ctx.translate(VW/2, tapY);
    ctx.scale(bounce, bounce);
    // soft glow so it reads as the call-to-action over the dark scenery.
    // Fill area must fully contain the gradient circle (>= 2*radius each axis)
    // or the rect clips the still-opaque gradient and leaves a hard edge.
    const gl = 0.45 + Math.sin(t * 4) * 0.18;
    const glowR = 230;
    const rg = ctx.createRadialGradient(0, 0, 12, 0, 0, glowR);
    rg.addColorStop(0, 'rgba(255, 211, 77, ' + (0.32 * gl) + ')');
    rg.addColorStop(1, 'rgba(255, 211, 77, 0)');
    ctx.fillStyle = rg;
    ctx.fillRect(-glowR, -glowR, glowR * 2, glowR * 2);
    drawText('TAP TO CHOOSE', 0, 0, 64, '#ffd34d', { stroke:'#3a1208', strokeW:14, shadow:'rgba(0,0,0,0.55)', sy:7 });
    ctx.restore();
  } else {
    const pulse = 0.7 + Math.sin(t * 5) * 0.3;
    ctx.globalAlpha = pulse;
    drawText('TAP TO CHOOSE', VW/2, VH * 0.91, 44, '#fff', { stroke:'#3a1208', strokeW:10, shadow:'rgba(0,0,0,0.5)', sy:6 });
    ctx.globalAlpha = 1;
  }
}

// ---- PLAY ----
const playState = {
  player: { x: VW/2, y: GROUND_Y, vx: 0, frame: 0, frameT: 0, dir: 1, invuln: 0, flashT: 0 },
  phantoms: [],   // {x, vy, r, rot, vr, warned, warnX, fallSfxPlayed}
  gems: [],
  warnings: [],   // {x, t, life}
  score: 0,
  hearts: MAX_HEARTS,
  timeLeft: GAME_DURATION,
  spawnTimer: 0,
  gemTimer: 1.5,
  shake: 0,
  difficulty: 1,
  gemCollects: []   // { x, y, t } — +1 score pop animations
};
function initPlay(){
  playState.player.x = VW/2;
  playState.player.vx = 0;
  playState.player.invuln = 0;
  playState.player.flashT = 0;
  playState.phantoms.length = 0;
  playState.gems.length = 0;
  playState.warnings.length = 0;
  playState.score = 0;
  playState.hearts = MAX_HEARTS;
  playState.timeLeft = GAME_DURATION;
  playState.spawnTimer = 0.5;
  playState.gemTimer = 0.8;
  playState.shake = 0;
  playState.difficulty = 1;
  playState.gemCollects.length = 0;
  // Movement tutorial: the game stays frozen (no phantoms, gems, or clock) and shows
  // the arrows until the player actually steers the animal. A short grace follows the
  // first move, then the threat begins — so we know the player understands the control.
  playState.hintAlpha = 0;       // eases in while waiting, out once moved
  playState.moved = false;       // set true on the player's first steer
  playState.graceT = 0;          // brief delay after first move before phantoms fall
}

function updatePlay(dt){
  const P = playState.player;
  // Difficulty ramps: easier first 4s, then ramps to ~2x
  const elapsed = GAME_DURATION - playState.timeLeft;
  playState.difficulty = 1 + Math.min(1.2, elapsed * 0.06);

  // Input → move target
  let targetX = P.x;
  if (input.down){
    targetX = input.x;
  }
  const dx = targetX - P.x;
  const maxSpeed = 700;
  const moveAmt = Math.sign(dx) * Math.min(Math.abs(dx) * 8 * dt, maxSpeed * dt);
  P.x += moveAmt;
  P.x = Math.max(80, Math.min(VW - 80, P.x));
  if (Math.abs(moveAmt) > 1) P.dir = moveAmt > 0 ? 1 : -1;

  const moving = Math.abs(moveAmt) > 0.5;
  const walkN       = chosenAnimal.walkFrames    || 8;
  const idleN       = chosenAnimal.idleFrames    || 6;
  const idleFrameTime = chosenAnimal.idleFrameTime || 0.12;
  if (moving){
    P.frameT += dt;
    if (P.frameT > 0.07){ P.frameT = 0; P.frame = (P.frame + 1) % walkN; }
  } else {
    P.frameT += dt;
    if (P.frameT > idleFrameTime){ P.frameT = 0; P.frame = (P.frame + 1) % idleN; }
  }
  P.walking = moving;

  if (P.invuln > 0) P.invuln -= dt;
  if (P.flashT > 0) P.flashT -= dt;

  // Movement tutorial — freeze the game until the player steers the animal.
  if (!playState.moved){
    playState.hintAlpha += (1 - playState.hintAlpha) * Math.min(1, dt * 7);
    if (Math.abs(moveAmt) > 2){ playState.moved = true; playState.graceT = 0.6; }
  } else {
    playState.hintAlpha += (0 - playState.hintAlpha) * Math.min(1, dt * 7);
    if (playState.graceT > 0) playState.graceT -= dt;
  }
  const inTutorial = !playState.moved || playState.graceT > 0;

  // Spawn phantoms (held until the player has moved)
  if (!inTutorial){
    playState.spawnTimer -= dt;
    if (playState.spawnTimer <= 0){
      spawnPhantom();
      playState.spawnTimer = (0.95 - playState.difficulty * 0.25) + Math.random() * 0.35;
    }
  }
  // Spawn gems (held until the player has moved)
  if (!inTutorial){
    playState.gemTimer -= dt;
    if (playState.gemTimer <= 0){
      spawnGem();
      playState.gemTimer = 1.4 + Math.random() * 1.4;
    }
  }

  // Update phantoms
  for (let i = playState.phantoms.length - 1; i >= 0; i--){
    const ph = playState.phantoms[i];
    ph.x += (ph.vx || 0) * dt;
    ph.y += ph.vy * dt;
    ph.animT += dt;
    // Warning indicator at the predicted landing X (accounts for diagonal drift)
    if (!ph.warned && ph.y > VH * 0.15){
      const tToLand = Math.max(0, (GROUND_Y - ph.y) / ph.vy);
      const landX = ph.x + (ph.vx || 0) * tToLand;
      playState.warnings.push({ x: landX, t: 0, life: 0.8 });
      ph.warned = true;
      if (!ph.fallSfxPlayed){ playSfx('fall'); ph.fallSfxPlayed = true; }
    }
    // Collision with player (hit-box centered roughly on body)
    if (P.invuln <= 0){
      const dx2 = ph.x - P.x, dy2 = ph.y - (P.y - ANIMAL_DISPLAY_H * 0.45);
      const d2 = dx2*dx2 + dy2*dy2;
      const hitR = ph.r + 50;
      if (d2 < hitR * hitR){
        // HIT
        playState.phantoms.splice(i, 1);
        playState.hearts = Math.max(0, playState.hearts - 1);
        P.invuln = 1.2;
        P.flashT = 0.4;
        playState.shake = 12;
        spawnBurst(P.x, P.y - 60, 22, '#ff5b8a');
        playSfx('death');
        continue;
      }
    }
    // Hit ground
    if (ph.y > GROUND_Y){
      playState.phantoms.splice(i, 1);
      spawnBurst(ph.x, GROUND_Y + 8, 14, '#7d2a8a');
      playState.shake = Math.max(playState.shake, 6);
      continue;
    }
  }
  // Update gems
  for (let i = playState.gems.length - 1; i >= 0; i--){
    const g = playState.gems[i];
    g.y += g.vy * dt;
    g.rot += dt * 4;
    const dx2 = g.x - P.x, dy2 = g.y - (P.y - ANIMAL_DISPLAY_H * 0.45);
    if (dx2*dx2 + dy2*dy2 < (GEM_RADIUS + 50) * (GEM_RADIUS + 50)){
      playState.gems.splice(i, 1);
      playState.score += 1;
      // Sapphire pop: scale-up + fade, plus blue sparkle fan
      playState.gemCollects.push({ x: g.x, y: g.y, t: 0 });
      for (let k = 0; k < 8; k++){
        const ang = (k / 8) * Math.PI * 2;
        const spd = 160 + Math.random() * 140;
        particles.push({
          x: g.x, y: g.y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 60,
          life: 0.45 + Math.random() * 0.25,
          maxLife: 0.7,
          size: 4 + Math.random() * 5,
          color: k % 2 === 0 ? '#5be8ff' : '#a8f0ff'
        });
      }
      playSfx('gem');
      continue;
    }
    if (g.y > GROUND_Y + 30){ playState.gems.splice(i, 1); }
  }
  // Update gem collect pop animations
  for (let i = playState.gemCollects.length - 1; i >= 0; i--){
    playState.gemCollects[i].t += dt;
    if (playState.gemCollects[i].t > 0.7) playState.gemCollects.splice(i, 1);
  }
  // Update warnings
  for (let i = playState.warnings.length - 1; i >= 0; i--){
    const w = playState.warnings[i];
    w.t += dt; w.life -= dt;
    if (w.life <= 0) playState.warnings.splice(i, 1);
  }

  // shake decay
  playState.shake *= Math.pow(0.001, dt);

  // timer — paused during the tutorial window so the player gets full play time
  if (!inTutorial){
    playState.timeLeft -= dt;
  }
  if (playState.timeLeft <= 0 || playState.hearts <= 0){
    endWon = playState.timeLeft <= 0 && playState.hearts > 0;
    if (!endWon) playSfx('stinger');
    setScene('end', initEnd);
  }
}

function spawnPhantom(){
  const x = 100 + Math.random() * (VW - 200);
  const r = 44 + Math.random() * 22;
  const fallScale = GROUND_Y / 704;  // normalise fall time: 704 = landscape GROUND_Y
  const vy = (320 + Math.random() * 180) * (0.85 + playState.difficulty * 0.25) * fallScale;
  // ~45% of phantoms drift diagonally. vx is clamped so the predicted
  // landing X stays within the play area (no phantoms flying off-screen).
  let vx = 0;
  if (Math.random() < 0.45){
    const tToLand = (GROUND_Y + 100) / vy;
    const headroom = Math.min(x - 80, VW - 80 - x);
    const maxVx = Math.max(40, (headroom / tToLand) * 0.85);
    vx = (Math.random() * 2 - 1) * maxVx;
  }
  playState.phantoms.push({
    x, y: -100,
    vx, vy, r,
    variant: Math.floor(Math.random() * 3),
    animT: Math.random() * 2,           // desync animation per phantom
    warned: false,
    fallSfxPlayed: false
  });
}
function spawnGem(){
  const x = 120 + Math.random() * (VW - 240);
  const fallScale = GROUND_Y / 704;
  playState.gems.push({ x, y: -60, vy: (230 + Math.random()*70) * fallScale, rot: 0 });
}

function drawGameWorld(t, paused){
  // Warnings (orange targeting rings)
  if (!paused){
    for (const w of playState.warnings){
      const fade = Math.max(0, w.life / 0.8);
      ctx.globalAlpha = fade;
      drawPhantomShadow(w.x, w.t);
      ctx.globalAlpha = 1;
    }
  }

  // Gems
  for (const g of playState.gems){
    drawGem(g.x, g.y, GEM_RADIUS, t);
  }

  // +1 score popup — rises upward and fades
  const DUR = 0.7;
  for (const gc of playState.gemCollects){
    const frac  = gc.t / DUR;                     // 0→1 over lifetime
    const alpha = 1 - Math.pow(frac, 1.5);        // hold then fade
    const rise  = frac * 80;                       // floats up 80px
    // pop-in scale: big at start, settles to 1
    const sc    = 1 + Math.max(0, 0.4 - frac * 2) * 1.5;
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.translate(gc.x, gc.y - rise);
    ctx.scale(sc, sc);
    drawText('+1', 0, 0, 38, '#ffd93d', {
      stroke: '#7a3800', strokeW: 7,
      shadow: 'rgba(0,0,0,0.4)', sy: 4
    });
    ctx.restore();
  }

  // Player
  const P = playState.player;
  const a = chosenAnimal;
  const sheetKey = P.walking ? a.walk : a.idle;
  const img = images[sheetKey];
  if (img){
    const frames = P.walking ? (a.walkFrames || 8) : (a.idleFrames || 6);
    const fW = img.width / frames, fH = img.height;
    // Scale idle sprite down so the forward-facing character matches the
    // apparent height of the side-walking sprite (measured from sprite fill).
    const idleScale = (!P.walking && a.idleScale) ? a.idleScale : 1;
    const dh = ANIMAL_DISPLAY_H * idleScale * (a.sizeScale || 1);
    const dw = fW * (dh/fH);
    // Use per-animal measured bottom pad so feet land exactly on GROUND_Y for all characters.
    const bottomPad = P.walking ? (a.walkBottomPad || SPRITE_BOTTOM_PAD) : (a.idleBottomPad || SPRITE_BOTTOM_PAD);
    const padPx = dh * bottomPad;

    // Ground shadow oval beneath player feet (bigger, softer for new sprite size)
    const shadowR = dw * 0.28;
    ctx.save();
    const sg = ctx.createRadialGradient(P.x, P.y, 0, P.x, P.y, shadowR);
    sg.addColorStop(0, 'rgba(0,0,0,0.45)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.ellipse(P.x, P.y + 2, shadowR, 12, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Foot dust puffs when moving
    if (!paused && P.walking && Math.random() < 0.45){
      particles.push({
        x: P.x + (Math.random() - 0.5) * 30,
        y: P.y - 2,
        vx: -P.dir * (40 + Math.random() * 60),
        vy: -30 - Math.random() * 30,
        life: 0.35 + Math.random() * 0.2,
        maxLife: 0.55,
        size: 5 + Math.random() * 5,
        color: 'rgba(180, 160, 120, 0.65)'
      });
    }

    if (P.flashT > 0) ctx.globalAlpha = (Math.floor(P.flashT * 24) % 2 === 0) ? 0.35 : 1;
    drawSprite(img, P.frame % frames, fW, fH, P.x - dw/2, P.y - dh + padPx, dw, dh, P.dir < 0);
    ctx.globalAlpha = 1;
  }

  // Phantoms (with glow halo)
  for (const ph of playState.phantoms){
    drawPhantom(ph.x, ph.y, ph.r, ph.variant, ph.animT, t + ph.x * 0.013, Math.atan2(ph.vx || 0, ph.vy));
  }
}
function drawSunMedallion(cx, cy, r, t){
  // Aztec sun rays
  ctx.save();
  ctx.translate(cx, cy);
  const rayCount = 12;
  for (let i = 0; i < rayCount; i++){
    const a = (i / rayCount) * Math.PI * 2 + t * 0.15;
    ctx.save();
    ctx.rotate(a);
    const rg = ctx.createLinearGradient(0, -r, 0, -r * 1.55);
    rg.addColorStop(0, '#d49830');
    rg.addColorStop(1, '#8a5810');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(-r*0.18, -r);
    ctx.lineTo(0, -r * 1.55);
    ctx.lineTo(r*0.18, -r);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  // Disc
  const dg = ctx.createRadialGradient(0, -r*0.3, r*0.2, 0, 0, r);
  dg.addColorStop(0, '#ffe8a0');
  dg.addColorStop(0.5, '#f5c43e');
  dg.addColorStop(1, '#a87018');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#3a1f08'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke();
  // inner ring
  ctx.strokeStyle = '#3a1f08'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawPlate(x, y, w, h){
  // Dark wood plate with gold ornate edge
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(x + 4, y + 5, w, h, 14);
  ctx.fill();
  const gg = ctx.createLinearGradient(0, y, 0, y + h);
  gg.addColorStop(0, '#d49830'); gg.addColorStop(1, '#7c5210');
  ctx.fillStyle = gg;
  roundRect(x, y, w, h, 14);
  ctx.fill();
  const ig = ctx.createLinearGradient(0, y + 4, 0, y + h - 4);
  ig.addColorStop(0, '#3a1f10'); ig.addColorStop(1, '#22120a');
  ctx.fillStyle = ig;
  roundRect(x + 4, y + 4, w - 8, h - 8, 10);
  ctx.fill();
}

// Clean single-stroke arrow — drawn like one confident pen stroke (shaft + head)
// with rounded caps, flat gold over a dark outline. Points left (dir=-1) or right
// (dir=+1) and pulses outward to suggest motion.
function drawGameArrow(cx, cy, dir, t, alpha){
  if (alpha < 0.02) return;
  const bob = (Math.sin(t * 3) * 0.5 + 0.5) * 14;       // 0..14px outward pulse
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(cx + dir * bob, cy);
  ctx.scale(dir, 1);                                    // stroke is built pointing +x
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // shaft + chevron head as a single stroke
  const stroke = () => {
    ctx.beginPath();
    ctx.moveTo(-40, 0); ctx.lineTo(40, 0);              // shaft
    ctx.moveTo(14, -26); ctx.lineTo(46, 0); ctx.lineTo(14, 26); // head
  };
  ctx.strokeStyle = '#3a1208'; ctx.lineWidth = 24; stroke(); ctx.stroke();  // dark outline
  ctx.strokeStyle = '#ffce3a'; ctx.lineWidth = 13; stroke(); ctx.stroke();  // flat gold
  ctx.restore();
}
// Movement tutorial overlay: caption + a gold arrow on each side of the animal,
// both at the animal's body level.
function drawMoveHint(t){

  const off = Math.min(VW * 0.30, 210);
  drawGameArrow(P.x - off, arrowY, -1, t, a);
  drawGameArrow(P.x + off, arrowY,  1, t, a);
  // caption above
  ctx.save();
  ctx.globalAlpha = a;
  const cap = 0.97 + Math.sin(t * 4) * 0.03;
  ctx.translate(VW/2, arrowY - 290);
  ctx.scale(cap, cap);
  drawText('DRAG TO MOVE', 0, 0, 46, '#ffd34d', { stroke:'#3a1208', strokeW:11, shadow:'rgba(0,0,0,0.5)', sy:5 });
  ctx.restore();
}
function drawPlay(t){

function drawGameThumb(cx, cy, size, label, img){
  ctx.save();
  ctx.translate(cx, cy);
  // drop shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(-size/2 + 4, -size/2 + 6, size, size, 18);
  ctx.fill();
  // gold ornate outer frame
  const og = ctx.createLinearGradient(0, -size/2, 0, size/2);
  og.addColorStop(0, '#ffd86b'); og.addColorStop(0.5, '#d49830'); og.addColorStop(1, '#8e5d18');
  ctx.fillStyle = og;
  roundRect(-size/2, -size/2, size, size, 18);
  ctx.fill();
  // inner image area: clip to rounded rect then draw the thumbnail filling it
  const pad = 7;
  const inner = size - pad * 2;
  ctx.save();
  ctx.beginPath();
  // roundRect path for clipping
  const x = -size/2 + pad, y = -size/2 + pad, w = inner, h = inner, r = 11;
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.clip();
  if (img){
    ctx.drawImage(img, x, y, inner, inner);
  } else {
    // fallback flat colour
    ctx.fillStyle = '#3a1f10';
    ctx.fillRect(x, y, inner, inner);
  }
  ctx.restore();
  ctx.restore();
}

function drawEnd(t){
  drawSkyAndBg(t);
  // Dark scrim — warm red tint on loss to signal failure, neutral on win
  ctx.fillStyle = endWon ? 'rgba(20, 14, 28, 0.55)' : 'rgba(28, 8, 8, 0.66)';
  ctx.fillRect(0, 0, VW, VH);

  // Layout positions differ between portrait and landscape.
  // Portrait card/thumbnail sizes scale with VH so short screens (SE) stay tidy.
  const titleY    = isPortrait ? VH * 0.055 : 70;
  const cardX     = isPortrait ? VW / 2     : VW * 0.25;
  const cardCy    = isPortrait ? VH * 0.175 : VH * 0.5;
  const cardW     = isPortrait ? Math.min(490, Math.round(VH * 0.31)) : 520;
  const contentCx = isPortrait ? VW / 2     : VW * 0.66;
  const scorePlY  = isPortrait ? VH * 0.335 : 200;
  const subY      = isPortrait ? VH * 0.405 : 268;
  const gridTop   = isPortrait ? VH * 0.49  : 362;
  const titleSize = isPortrait ? 48         : 64;

  // Title — top center
  const popT = Math.min(1, t * 4);
  const titleSc = 0.4 + popT * 0.6 + Math.sin(t * 5) * 0.02;
  const titleTxt = endWon ? 'You escaped the phantoms!' : 'The phantoms caught you!';

  const cardImg = images.ajCard;
  if (cardImg){

    rg.addColorStop(1, 'rgba(255, 220, 110, 0)');
    ctx.fillStyle = rg;
    ctx.fillRect(cardX - haloR, cardCy - haloR, cardW, cardW);
    ctx.save();
    ctx.translate(cardX, cardCy + bob);
    ctx.rotate(wobble * Math.PI / 180 * 0.25);
    ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 8;
    ctx.drawImage(cardImg, -cardW/2, -cardH/2, cardW, cardH);
    ctx.restore();
  }

  // Score plate — measure & center the gem icon + score + label inside the plate.
  ctx.save();
  ctx.translate(contentCx, scorePlY);

  const scoreTxt = 'x ' + playState.score;

  ctx.font = "900 48px 'AJDelivery', 'Arial Black'";
  const scoreW = ctx.measureText(scoreTxt).width;
  ctx.font = "900 38px 'AJDelivery', 'Arial Black'";
  const gemsW = ctx.measureText(gemsTxt).width;
  const gemsRowW = gemDia + gemGap + scoreW + gemGap + gemsW;
  let cur = -gemsRowW / 2;
  drawGem(cur + gemDia/2, 0, 26, t);                                                  cur += gemDia + gemGap;
  drawText(scoreTxt, cur, 6, 48, '#ffd86b', { align:'left', stroke:'#1a0d04', strokeW:6 });  cur += scoreW + gemGap;
  drawText(gemsTxt, cur, 6, 38, '#fff', { align:'left', stroke:'#1a0d04', strokeW:5 });
  ctx.restore();

  // "40+ MINI-GAMES TO PLAY!" — single line
  drawText('40+ MINI-GAMES TO PLAY!', contentCx, subY, 34, '#fff', { stroke:'#3a1208', strokeW:9, shadow:'rgba(0,0,0,0.5)', sy:6 });

  // Mini game thumbnails — 3 cols x 2 rows of real artwork
  const games = [

    { label: 'ROLL!',    img: 'mgRoll'    },
    { label: 'PEST',     img: 'mgPest'    },
    { label: 'DRESSED',  img: 'mgDressed' },

  // drop shadow

  roundRect(-btnW/2 + 8, -btnH/2 + 12, btnW, btnH, radius);
  ctx.fill();
  // body gradient

  ctx.fillStyle = bg;
  roundRect(-btnW/2, -btnH/2, btnW, btnH, radius);
  ctx.fill();
  // glossy top highlight
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  roundRect(-btnW/2 + 14, -btnH/2 + 10, btnW - 28, btnH * 0.38, radius * 0.7);
  ctx.fill();
  // white pill border
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  roundRect(-btnW/2, -btnH/2, btnW, btnH, radius);
  ctx.stroke();
  drawText('PLAY FREE!', 0, -2, txtSize, '#fff', { stroke:'#0d4a1a', strokeW:11, shadow:'rgba(0,0,0,0.35)', sy:5 });
  ctx.restore();

  // Tap-anywhere hint below the CTA (portrait has room)
  if (isPortrait){
    const hintA = 0.6 + Math.sin(endState.ctaPulse * 5) * 0.25;
    ctx.globalAlpha = hintA;
    drawText('Tap anywhere to install', VW/2, by + btnH/2 + 46, 26, '#ffe8c0', { stroke:'#3a1208', strokeW:5, shadow:'rgba(0,0,0,0.4)', sy:3 });
    ctx.globalAlpha = 1;
  }
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ============================================================
// CTA / Store open (Mintegral MRAID + fallback)
// ============================================================
function openStore(){
  try {
    if (window.mraid && typeof window.mraid.open === 'function'){
      window.mraid.open(STORE_URL);
      return;
    }
  } catch(e){}
  try {
    if (window.parent && window.parent.openAppStore){
      window.parent.openAppStore(STORE_URL);
      return;
    }
  } catch(e){}
  try {
    if (window.gameEnd){ window.gameEnd(); }
  } catch(e){}
  try { window.open(STORE_URL, '_blank'); } catch(e){}
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastT = performance.now();
let started = false;
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  sceneT += dt;

  // clear & draw based on scene
  setTransform();

  if (!started){
    drawLoading();
    if (assetsLoaded >= assetsTotal && assetsTotal > 0){
      started = true;
      // signal mraid ready
      try { if (window.mraid && window.mraid.getState && window.mraid.getState() === 'loading'){
        window.mraid.addEventListener('ready', ()=>{}); } } catch(e){}
      // Landscape: play video intro. Portrait: skip straight to game intro.
      if (isPortrait){ setScene('picker', initPicker); }
      else            { setScene('videoIntro', initVideoIntro); }
    }
  } else if (scene === 'videoIntro'){
    updateVideoIntro(dt);
  } else if (scene === 'intro'){
    updateIntro(dt); drawIntro(sceneT);
  } else if (scene === 'picker'){
    updatePicker(dt); drawPicker(sceneT);
  } else if (scene === 'ready'){
    updateReady(dt); drawReady(sceneT);
  } else if (scene === 'play'){
    updatePlay(dt);
    drawPlay(sceneT);
    updateParticles(dt);
    drawParticles();
  } else if (scene === 'end'){
    updateEnd(dt); drawEnd(sceneT);
    updateParticles(dt); drawParticles();
  }

  // reset input edges
  input.justDown = false;
  input.justUp = false;

  requestAnimationFrame(frame);
}

// Kick off
loadAll();
// Pre-warm the canvas font cache so the first frame renders in AJ fonts
// (Canvas doesn't trigger font fetches; we need an explicit load).
if (document.fonts && document.fonts.load){
  Promise.all([
    document.fonts.load('80px AJTiki'),
    document.fonts.load('40px AJDelivery'),
  ]).catch(()=>{});
}
requestAnimationFrame(frame);

// MRAID lifecycle — force landscape orientation for Mintegral rewarded
function lockLandscape(){
  try {
    if (window.mraid && typeof window.mraid.setOrientationProperties === 'function'){
      window.mraid.setOrientationProperties({
        allowOrientationChange: false,
        forceOrientation: 'landscape'
      });
    }
  } catch(e){}
  // Mintegral-specific helper (some SDK versions expose this)
  try {
    if (window.mraid && typeof window.mraid.notifyReady === 'function'){
      window.mraid.notifyReady();
    }
  } catch(e){}
}
function mraidReady(){
  try { window.mraid.removeEventListener('ready', mraidReady); } catch(e){}
  lockLandscape();
}
try {
  if (window.mraid){
    if (window.mraid.getState && window.mraid.getState() === 'loading'){
      window.mraid.addEventListener('ready', mraidReady);
    } else {
      mraidReady();
    }
  }
} catch(e){}

})();
</script>
